name: Build FinanceFlow APK

on:
  push:
    paths:
      - 'financeflow-android/**'
      - 'tests/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      FF_SIGNING_KEYSTORE_BASE64: ${{ secrets.FF_SIGNING_KEYSTORE_BASE64 }}
      FF_SIGNING_STORE_PASSWORD: ${{ secrets.FF_SIGNING_STORE_PASSWORD }}
      FF_SIGNING_KEY_ALIAS: ${{ secrets.FF_SIGNING_KEY_ALIAS }}
      FF_SIGNING_KEY_PASSWORD: ${{ secrets.FF_SIGNING_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node for financial regression checks
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Financial accuracy regression tests
        run: node --test tests/*.test.cjs

      - name: Compact entry and transfer browser checks
        run: |
          npm install --no-save --prefix /tmp/financeflow-ui playwright@1.56.1
          /tmp/financeflow-ui/node_modules/.bin/playwright install --with-deps chromium
          NODE_PATH=/tmp/financeflow-ui/node_modules node tests/ui-regression.cjs

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Bank alert parser regression tests
        run: |
          mkdir -p /tmp/financeflow-parser-tests
          javac -d /tmp/financeflow-parser-tests financeflow-android/app/src/main/java/com/financeflow/app/BankAlertParser.java tests/BankAlertParserTest.java
          java -cp /tmp/financeflow-parser-tests com.financeflow.app.BankAlertParserTest

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Make gradlew executable
        run: chmod +x gradlew
        working-directory: financeflow-android

      - name: Prepare private signing store when configured
        if: env.FF_SIGNING_KEYSTORE_BASE64 != ''
        shell: python
        run: |
          import os, base64
          from pathlib import Path
          required = ['FF_SIGNING_STORE_PASSWORD', 'FF_SIGNING_KEY_ALIAS', 'FF_SIGNING_KEY_PASSWORD']
          if not all(os.environ.get(k) for k in required):
              raise RuntimeError('Signing secrets are incomplete')
          store = Path(os.environ['RUNNER_TEMP']) / 'financeflow-release.keystore'
          store.write_bytes(base64.b64decode(os.environ['FF_SIGNING_KEYSTORE_BASE64'], validate=True))
          store.chmod(0o600)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('FF_SIGNING_STORE_FILE=' + str(store) + '\n')

      - name: Build Release APKs (standard + full)
        run: ./gradlew testStandardDebugUnitTest assembleStandardRelease assembleFullRelease
        working-directory: financeflow-android

      - name: Rename APKs
        run: |
          STD=$(find financeflow-android/app/build/outputs/apk/standard/release -maxdepth 1 -name "app-standard-release*.apk" | head -1)
          FULL=$(find financeflow-android/app/build/outputs/apk/full/release -maxdepth 1 -name "app-full-release*.apk" | head -1)
          echo "Standard APK: $STD"
          echo "Full APK: $FULL"
          mv "$STD" financeflow-android/app/build/outputs/apk/standard/release/FinanceFlow.apk
          mv "$FULL" financeflow-android/app/build/outputs/apk/full/release/FinanceFlow-Full.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FinanceFlow-APK
          path: |
            financeflow-android/app/build/outputs/apk/standard/release/FinanceFlow.apk
            financeflow-android/app/build/outputs/apk/full/release/FinanceFlow-Full.apk
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: FinanceFlow v1.0.${{ github.run_number }}
          body: |
            FinanceFlow Android APK

            Two builds are provided:
            - **FinanceFlow.apk** (recommended) — omits notification-access bank-alert detection.
            - **FinanceFlow-Full.apk** — adds the optional "Bank Alerts" auto-detect feature (reads notification text for bank debit/credit alerts). Review the requested permission and install only from the release source you trust.

            **Install instructions:**
            1. Download the APK you want below
            2. On your Android phone: Settings → Security → enable "Install unknown apps"
            3. Open the APK and tap Install
          files: |
            financeflow-android/app/build/outputs/apk/standard/release/FinanceFlow.apk
            financeflow-android/app/build/outputs/apk/full/release/FinanceFlow-Full.apk
          draft: false
          prerelease: false
