name: Build FinanceFlow APK

on:
  push:
    paths:
      - 'financeflow-android/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew
        working-directory: financeflow-android

      - name: Build Release APKs (standard + full)
        run: ./gradlew assembleStandardRelease assembleFullRelease
        working-directory: financeflow-android

      - name: Rename APKs
        run: |
          STD=$(find financeflow-android/app/build/outputs/apk/standard/release -maxdepth 1 -name "app-standard-release*.apk" | head -1)
          FULL=$(find financeflow-android/app/build/outputs/apk/full/release -maxdepth 1 -name "app-full-release*.apk" | head -1)
          echo "Standard APK: $STD"
          echo "Full APK: $FULL"
          mv "$STD" financeflow-android/app/build/outputs/apk/standard/release/FinanceFlow.apk
          mv "$FULL" financeflow-android/app/build/outputs/apk/full/release/FinanceFlow-Full.apk

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FinanceFlow-APK
          path: |
            financeflow-android/app/build/outputs/apk/standard/release/FinanceFlow.apk
            financeflow-android/app/build/outputs/apk/full/release/FinanceFlow-Full.apk
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: FinanceFlow v1.0.${{ github.run_number }}
          body: |
            FinanceFlow Android APK

            Two builds are provided:
            - **FinanceFlow.apk** (recommended) — never asks for notification access, so Google Play Protect won't flag it on install.
            - **FinanceFlow-Full.apk** — adds the optional "Bank Alerts" auto-detect feature (reads notification text for bank debit/credit alerts). Because it requests notification access, Play Protect may show a one-time warning on sideloaded installs — this is expected for that permission and can be dismissed.

            **Install instructions:**
            1. Download the APK you want below
            2. On your Android phone: Settings → Security → enable "Install unknown apps"
            3. Open the APK and tap Install
          files: |
            financeflow-android/app/build/outputs/apk/standard/release/FinanceFlow.apk
            financeflow-android/app/build/outputs/apk/full/release/FinanceFlow-Full.apk
          draft: false
          prerelease: false
