name: Build FinanceFlow APK

on:
  push:
    paths:
      - 'financeflow-android/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make gradlew executable
        run: chmod +x gradlew
        working-directory: financeflow-android

      - name: Build Release APK
        run: ./gradlew assembleRelease
        working-directory: financeflow-android

      - name: Rename APK
        run: |
          APK=$(find financeflow-android/app/build/outputs/apk/release -maxdepth 1 -name "app-release*.apk" | head -1)
          echo "Found APK: $APK"
          mv "$APK" financeflow-android/app/build/outputs/apk/release/FinanceFlow.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FinanceFlow-APK
          path: financeflow-android/app/build/outputs/apk/release/FinanceFlow.apk
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: FinanceFlow v1.0.${{ github.run_number }}
          body: |
            FinanceFlow Android APK

            **Install instructions:**
            1. Download `FinanceFlow.apk` below
            2. On your Android phone: Settings → Security → enable "Install unknown apps"
            3. Open the APK and tap Install
          files: financeflow-android/app/build/outputs/apk/release/FinanceFlow.apk
          draft: false
          prerelease: false
