plugins {
    id 'com.android.application'
}

android {
    namespace 'com.financeflow.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.financeflow.app"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    signingConfigs {
        release {
            // Fixed keystore checked into the repo so every CI build (fresh runner
            // each time) signs with the same key. Without this, AGP falls back to
            // an auto-generated debug.keystore that differs per machine/run, so
            // installing a new build fails ("App not installed") over an existing one.
            storeFile file('financeflow-release.keystore')
            storePassword 'financeflow123'
            keyAlias 'financeflow'
            keyPassword 'financeflow123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.activity:activity:1.8.2'
}
