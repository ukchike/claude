plugins {
    id 'com.android.application'
}

android {
    namespace 'com.financeflow.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.financeflow.app"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    // Google Play Protect hard-blocks sideloaded apps that combine "unknown developer" with a
    // NotificationListenerService (used here for Bank Alerts auto-detect) — it's a reputation
    // heuristic, not something a manifest tweak can silence. Splitting into two flavors lets
    // most users install a build that never asks for notification access at all (and isn't
    // flagged), while anyone who wants Bank Alerts can opt into the Full build instead.
    flavorDimensions "distribution"
    productFlavors {
        // No applicationIdSuffix on "full": every FinanceFlow release to date already shipped
        // with Bank Alerts, so existing installs are on this package id — keeping it here means
        // updates keep working in place for anyone already using the feature.
        full {
            dimension "distribution"
        }
        standard {
            dimension "distribution"
            applicationIdSuffix ".standard"
            versionNameSuffix "-standard"
        }
    }

    signingConfigs {
        release {
            // Fixed keystore checked into the repo so every CI build (fresh runner
            // each time) signs with the same key. Without this, AGP falls back to
            // an auto-generated debug.keystore that differs per machine/run, so
            // installing a new build fails ("App not installed") over an existing one.
            storeFile file('financeflow-release.keystore')
            storePassword 'financeflow123'
            keyAlias 'financeflow'
            keyPassword 'financeflow123'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.biometric:biometric:1.1.0'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.activity:activity:1.8.2'
}
