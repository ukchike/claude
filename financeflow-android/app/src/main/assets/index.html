    if(t.split){
      const total=t.items.reduce((s,x)=>s+x.amount,0);const isOpen=expandedSplit===t.groupId;
      return`<div class="tx-row" onclick="expandedSplit=expandedSplit==='${t.groupId}'?null:'${t.groupId}';render()"><div class="tx-icon" style="background:rgba(var(--accent-rgb),.1);color:var(--accent)">&#128203;</div><div style="flex:1;min-width:0"><div class="fz11 fw6 ellip">${esc(t.description||"Split transaction")}</div><div class="fz9 muted">Split &#183; ${t.items.length} categories ${isOpen?"&#9650;":"&#9660;"}</div></div><span class="cat-badge" style="background:rgba(var(--accent-rgb),.15);color:var(--accent)">Split</span><div class="fz12 fw7 ${t.type==="income"?"green":"red"}" style="min-width:58px;text-align:right">${t.type==="income"?"+":"-"}${fmt(total)}</div></div>${isOpen?`<div style="padding:2px 12px 8px 46px;background:var(--bg)">${t.items.map(x=>`<div class="flex-b" style="padding:6px 0;border-bottom:1px solid var(--border);cursor:pointer" onclick="event.stopPropagation();showModal('edit','${x.id}')"><span class="fz10 muted">${esc(x.category)}${x.subcategory?" · "+esc(x.subcategory):""}</span><span class="fz11 fw6">${fmt(x.amount)}</span></div>`).join("")}</div>`:""}`;
    }
    if(t.type==="transfer")return`<div class="tx-row" onclick="${rowClick(t)}">${checkHTML(t)}<div class="tx-icon" style="background:rgba(var(--accent-rgb),.1);color:var(--accent)">&#8646;</div><div style="flex:1;min-width:0"><div class="fz11 fw6 ellip">${esc(t.description||"Transfer")}</div><div class="fz9 muted">${esc(accName(t.fromAccountId))} &#8594; ${esc(accName(t.toAccountId))}</div></div><span class="cat-badge" style="background:rgba(var(--accent-rgb),.15);color:var(--accent)">Transfer</span><div class="fz12 fw7 accent" style="min-width:58px;text-align:right">${fmt(t.amount)}</div></div>`;
    const acc=accounts.find(a=>a.id===t.accountId);return`<div class="tx-row" onclick="${rowClick(t)}">${checkHTML(t)}<div class="tx-icon" style="background:${clr(t.category)}22;color:${clr(t.category)}">${catIcon(t.category)}</div><div style="flex:1;min-width:0"><div class="fz11 fw6 ellip">${esc(t.description||t.category)} ${t.source==="Recurring"?'<span class="rec-badge">&#128257;</span>':""}</div><div class="fz9 muted">${esc(acc?acc.name:"")} ${t.subcategory?"· "+esc(t.subcategory):""}</div></div><span class="cat-badge" style="background:${clr(t.category)}22;color:${clr(t.category)}">${esc(t.category)}</span><div class="fz12 fw7 ${t.type==="income"?"green":"red"}" style="min-width:58px;text-align:right">${t.type==="income"?"+":"-"}${fmt(t.amount)}</div></div>`;}).join("")}`;}).join(""):'<div class="muted fz12 tac" style="padding:40px">No transactions found</div>'}</div>`;
  const si=$("si");if(si&&search){si.focus();si.setSelectionRange(search.length,search.length);}
  if(selectMode&&selectedTxIds.size){
    const bar=document.createElement("div");bar.id="selectBar";bar.className="select-bar";
    bar.innerHTML=`<span class="fz11 fw7">${selectedTxIds.size} selected</span><div class="flex g6"><button class="btn btn-g btn-sm" onclick="openBulkEdit()">&#9998; Edit</button><button class="btn btn-g btn-sm" onclick="openBulkTransfer()">&#8646; Transfer</button><button class="btn btn-rd btn-sm" onclick="bulkDeleteSelected()">&#128465;</button></div>`;
    document.body.appendChild(bar);
  }
}
function toggleSelectMode(){selectMode=!selectMode;selectedTxIds=new Set();const b=$("selectBar");if(b)b.remove();render();}
function toggleTxSelect(id){if(selectedTxIds.has(id))selectedTxIds.delete(id);else selectedTxIds.add(id);const b=$("selectBar");if(b)b.remove();render();}

// ── BULK EDIT / BULK CONVERT-TO-TRANSFER (multi-select in Transactions) ──
function openBulkEdit(){
  if(!selectedTxIds.size)return;
  const ids=[...selectedTxIds];
  const firstTx=txns.find(x=>x.id===ids[0]);
  window._bulkCatType=firstTx&&firstTx.type==="income"?"income":"expense";
  window._bulkAcc=accounts[0]?.id||"";
  window._bulkCat="";window._bulkSub="";
  const mc=$("modal-container");
  mc.innerHTML=`<div class="modal-bg" onclick="showModal('close')"><div class="modal modal-lg" onclick="event.stopPropagation()"><div class="modal-handle"></div>
    <div class="flex-b mb16"><span class="fz16 fw7">Edit ${selectedTxIds.size} Transactions</span><button class="btn" style="padding:2px;color:var(--muted)" onclick="showModal('close')">&#10005;</button></div>
    <div class="fz10 muted mb14">Only fields you turn on below will be changed — everything else stays as it is on each transaction.</div>
    <div style="display:grid;gap:14px">
      <div><label class="flex g8 mb8"><input type="checkbox" id="bulkChgDate" onchange="$('bulkDateWrap').style.display=this.checked?'block':'none'"><span class="fz12 fw6">Change Date</span></label><div id="bulkDateWrap" style="display:none"><input class="inp" type="date" id="bulkDate"></div></div>
      <div><label class="flex g8 mb8"><input type="checkbox" id="bulkChgAcc" onchange="$('bulkAccWrap').style.display=this.checked?'block':'none'"><span class="fz12 fw6">Change Account</span></label><div id="bulkAccWrap" style="display:none"><button type="button" class="inp" style="text-align:left;display:flex;align-items:center;justify-content:space-between" onclick="openAccPicker('_bulkAcc','bulkAccLabel')"><span id="bulkAccLabel"></span><span class="muted">&#8250;</span></button></div></div>
      <div><label class="flex g8 mb8"><input type="checkbox" id="bulkChgCat" onchange="$('bulkCatWrap').style.display=this.checked?'block':'none'"><span class="fz12 fw6">Change Category / Subcategory</span></label><div id="bulkCatWrap" style="display:none"><button type="button" class="inp" style="text-align:left;display:flex;align-items:center;justify-content:space-between" onclick="openCatPicker('_bulkCatType','_bulkCat','_bulkSub','bulkCatLabel')"><span id="bulkCatLabel"></span><span class="muted">&#8250;</span></button><div class="fz9 muted mt6">Doesn't apply to any transfers in the selection.</div></div></div>
    </div>
    <button class="btn btn-p w100 mt16" style="justify-content:center;padding:14px" onclick="applyBulkEdit()">Apply to ${selectedTxIds.size} Transactions</button>
  </div></div>`;
  $("bulkAccLabel").textContent=accName(window._bulkAcc);
}
function applyBulkEdit(){
  const chgDate=$("bulkChgDate")?.checked,chgAcc=$("bulkChgAcc")?.checked,chgCat=$("bulkChgCat")?.checked;
  const newDate=$("bulkDate")?.value;
  let count=0;
  selectedTxIds.forEach(id=>{
    const t=txns.find(x=>x.id===id);if(!t)return;
    let touched=false;
    if(chgDate&&newDate){t.date=newDate;touched=true;}
    if(t.type!=="transfer"){
      if(chgAcc&&window._bulkAcc){t.accountId=window._bulkAcc;touched=true;}
      if(chgCat&&window._bulkCat){t.category=window._bulkCat;t.subcategory=window._bulkSub||"";touched=true;}
    }
    if(touched)count++;
  });
  save();showModal("close");
  selectMode=false;selectedTxIds=new Set();
  render();
  showToast("✅ Updated "+count+" transaction"+(count!==1?"s":""),"green");
}
function openBulkTransfer(){
  if(!selectedTxIds.size)return;
  if(accounts.length<2)return alert("Add a second account first to convert to transfers.");
  window._bulkTfFrom=accounts[0].id;window._bulkTfTo=accounts[1].id;
  const mc=$("modal-container");
  mc.innerHTML=`<div class="modal-bg" onclick="showModal('close')"><div class="modal" onclick="event.stopPropagation()"><div class="modal-handle"></div>
    <div class="flex-b mb12"><span class="fz14 fw7">&#8646; Convert ${selectedTxIds.size} to Transfers</span><button class="btn" style="padding:2px;color:var(--muted)" onclick="showModal('close')">&#10005;</button></div>
    <div class="fz10 muted mb12">Each transaction keeps its own amount, date, and description — only its type and accounts change.</div>
    <div style="display:grid;gap:12px">
      <div><span class="edit-label">From Account</span><button type="button" class="inp" style="text-align:left;display:flex;align-items:center;justify-content:space-between" onclick="openAccPicker('_bulkTfFrom','bulkTfFromLabel')"><span id="bulkTfFromLabel"></span><span class="muted">&#8250;</span></button></div>
      <div><span class="edit-label">To Account</span><button type="button" class="inp" style="text-align:left;display:flex;align-items:center;justify-content:space-between" onclick="openAccPicker('_bulkTfTo','bulkTfToLabel')"><span id="bulkTfToLabel"></span><span class="muted">&#8250;</span></button></div>
    </div>
    <button class="btn btn-p w100 mt16" style="justify-content:center;padding:14px" onclick="applyBulkTransfer()">&#8646; Convert</button>
  </div></div>`;
  $("bulkTfFromLabel").textContent=accName(window._bulkTfFrom);
  $("bulkTfToLabel").textContent=accName(window._bulkTfTo);
}
function applyBulkTransfer(){
  const from=window._bulkTfFrom,to=window._bulkTfTo;
  if(!from||!to)return alert("Select both accounts");
  if(from===to)return alert("From and To accounts must be different");
  let count=0;
  selectedTxIds.forEach(id=>{
    const t=txns.find(x=>x.id===id);if(!t)return;
    t.type="transfer";t.fromAccountId=from;t.toAccountId=to;
    delete t.category;delete t.subcategory;delete t.accountId;
    count++;
  });
  save();showModal("close");
  selectMode=false;selectedTxIds=new Set();
  render();
  showToast("⇄ Converted "+count+" to transfers","green");
}
function bulkDeleteSelected(){
  const n=selectedTxIds.size;if(!n)return;
  const removed=txns.filter(t=>selectedTxIds.has(t.id));
  txns=txns.filter(t=>!selectedTxIds.has(t.id));
  save();
  selectMode=false;selectedTxIds=new Set();
  render();
  showUndoToast("Deleted "+n+" transaction"+(n>1?"s":""),()=>{txns.push(...removed);save();});
}
function fmtD(d){const[y,m,day]=String(d).split("-").map(Number);const dt=new Date(y,(m||1)-1,day||1);const n=new Date();const td=new Date(n.getFullYear(),n.getMonth(),n.getDate());const df=Math.round((td-dt)/864e5);if(df===0)return"Today";if(df===1)return"Yesterday";return dt.toLocaleDateString("en-NG",{weekday:"short",day:"numeric",month:"short"});}
let _st;function doS(v){clearTimeout(_st);_st=setTimeout(()=>{search=v;render();},250);}

document.addEventListener("click",()=>{if(ppOpen||ppBOpen){closePP();render();}});

load();
processRecurring();
render();
relock(); // cold-start lock check; subsequent checks come from native onResume via relock() too
// Surface any bank alerts detected while the app was closed
if(bankAlertsEnabled){const pend=getPendingBankAlerts();if(pend.length)showToast("🔔 "+pend.length+" bank alert"+(pend.length>1?"s":"")+" detected — review in Settings","warn");}

</script>
</body>
